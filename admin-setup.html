<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101d29"><title>Vigie — Activation propriétaire</title><link rel="stylesheet" href="admin-access.css"></head>
<body><main class="access-card"><a class="brand" href="index.html"><span class="brand-mark">V</span><span>vigie<span>.</span></span></a><p class="eyebrow">ACTIVATION PRIVÉE · LIEN À USAGE UNIQUE</p><h1>Compte propriétaire</h1><p class="intro">Cette étape crée le premier compte administrateur de l’entreprise. Le lien expire après 24 heures et ne peut être utilisé qu’une fois.</p><form id="admin-setup-form"><label>Nom du propriétaire<input name="name" autocomplete="name" required minlength="2" placeholder="Votre nom complet"></label><label>Courriel ou numéro de téléphone<input name="identifier" autocomplete="username" required placeholder="Courriel ou téléphone"></label><label>Mot de passe<input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="8 caractères minimum"></label><label>Confirmer le mot de passe<input name="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Saisissez le mot de passe à nouveau"></label><p id="message" role="status"></p><button type="submit">Activer le compte propriétaire <span>→</span></button></form><a class="back-link" href="index.html">← Retour au site public</a></main><script src="admin-setup.js"></script></body></html>
